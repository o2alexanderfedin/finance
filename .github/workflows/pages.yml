# Publishes demo/ to GitHub Pages.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ DECISION TAKEN BY THE OWNER, 2026-08-17: PUBLISH.                        │
# │                                                                          │
# │ The deferred decision recorded below was made. The published copy is     │
# │ https://github.com/o2alexanderfedin/finance — a PUBLIC repository        │
# │ holding the same history. `fjs-dev/finance` stays private, and the job   │
# │ guard below means it can never publish by accident: both jobs run only   │
# │ when `github.repository_owner` is `o2alexanderfedin`.                    │
# │                                                                          │
# │ The owner was shown, and accepted, both material facts before deciding:  │
# │   - the history carries real dollar figures from their own IRS Wage and  │
# │     Income Transcript ($4,554.00 and $454.00, the 1099-G that drove      │
# │     Phase 20). No SSN, no scan and no binary was ever committed — that   │
# │     was verified across the whole history, not assumed.                  │
# │   - the repository carries 63 commits by a second author and has no      │
# │     LICENSE file, so the default is all-rights-reserved. No license was  │
# │     added unilaterally; that is the co-author's call to share.           │
# └──────────────────────────────────────────────────────────────────────────┘
#
# ── The original warning, kept because its REASONING is still correct ──────
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ This repository is PRIVATE. The demo executes the engine IN THE BROWSER,  │
# │ so the browser must download it: staging copies `fjs/**` into a           │
# │ world-readable site. That is the engine source verbatim, including its    │
# │ design-rationale comments.                                                │
# │                                                                          │
# │ There is no configuration of this workflow that avoids that. A demo that  │
# │ runs the real engine in a public page publishes the real engine. The only │
# │ question is whether it happens on purpose.                               │
# │                                                                          │
# │ Related: every `source ↗` / `proof ↗` link the demo renders points at     │
# │ github.com — publishing the site without also resolving repo visibility   │
# │ produces a public page whose central claim is broken. RESOLVED: the demo  │
# │ now links at the PUBLIC copy, so those links work for any viewer.         │
# │                                                                          │
# │ Status 2026-08-06: DEFERRED.  →  Status 2026-08-17: TAKEN, see above.     │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Publishing now runs on every push to `main` in the PUBLIC repository, plus a
# manual trigger. It was manual-only until the decision above was taken.
#
# GitHub Pages must also be enabled for the repository with "Source: GitHub
# Actions" (Settings → Pages). Until it is, the deploy step fails and nothing
# is published — which is the safe direction to fail in.
#
# ## What gets staged, and why it is not just `demo/`
#
# The demo imports the engine directly: `demo/index.html` resolves
# `../fjs/...` and, through its import map, `../functionalscript/...`. Both
# must sit BESIDE `demo/` in the published tree, so the site root is a staging
# directory containing all three rather than `demo/` itself.
#
# `functionalscript` is an ordinary npm dependency. It WAS a git submodule
# until 2026-08-18, when that submodule was removed; `npm ci` installs the
# package from `package.json`, which is where the engine resolves it from under
# test. Staging `node_modules/functionalscript`
# therefore publishes THE EXACT DEPENDENCY THE SUITE RAN AGAINST, and adds
# nothing new: no bundler, no transpiler, no second copy of anything.

name: Demo (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # THE GUARD. Only the public copy publishes. `fjs-dev/finance` runs this
    # file too -- it is the same commit -- and this is what stops it, rather
    # than relying on its Pages simply never having been enabled.
    if: github.repository_owner == 'o2alexanderfedin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - run: npm ci

      # The demo is presentation code and ships no proofs of its own, but it
      # is type-checked with the engine's own strict settings and it imports
      # the engine's modules. A red suite must not publish.
      - run: npm test

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -R demo _site/demo
          cp -R fjs _site/fjs
          cp -R node_modules/functionalscript _site/functionalscript
          # The spec is developer documentation, not part of the demo.
          rm -rf _site/demo/todo
          # A bare visit to the site root should land on the demo.
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8">' \
            '<title>finance — demo</title>' \
            '<meta http-equiv="refresh" content="0; url=./demo/">' \
            '<link rel="canonical" href="./demo/">' \
            '<p><a href="./demo/">finance — a Form 1040 engine that shows its work</a></p>' \
            > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.repository_owner == 'o2alexanderfedin'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
